<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="head1"></h1>
    <p id="para1"></p>
    <label id="para2"></label>

    <!--Login Boxes-->
    <br>
    <label>Username:</label>
    <input id="myText">

    <br>
    <label>Password:</label>
    <input id="myText2" type="password">

    <br>
    <label>Server IP:</label>
    <input id="ipInp">
    
    <!--BUTTONS!-->        
    <div id="buttons">
        <button id="LogButt" class="butts">Login</button>
    </div>

    <!--Chat Boxes-->
    <br>
    <label>Receiver:</label>
    <input id="sendTo">

    <br>
    <label>Output:</label>
    <input id="myText3" size="50">

    <div id="buttons2">
        <button id="OutButt" class="butts">Send</button>
    </div>

    <!--File Transfer-->
    <br>
    <label>Choose File:</label>
    <input type="file" id="fileInput">

    <div id="buttons3">
        <button id="FTPbutt" class="butts">Send File</button>
    </div>

    <br>
    <h2 id="head2"></h2>

    <script src="index.js"></script>
</body>
</html>
